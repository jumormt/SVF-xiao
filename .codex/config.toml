# Project-scoped Codex configuration for any trusted SVF-xiao checkout.
# Codex resolves relative project-config paths from this .codex/ directory.
# The wrapper discovers the repo root, Python interpreter, and harness binary.

[mcp_servers.svf]
command = "bash"
args = ["-lc", 'repo_root="$(git rev-parse --show-toplevel)" && cd "$repo_root" && exec .codex/bin/svf-mcp-server']
startup_timeout_sec = 20
tool_timeout_sec = 650
